[platformio]
src_dir = main
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
monitor_speed = 921600
upload_speed = 921600

; same firmware without the profiler: compare the "iterations/s" log line to measure real overhead
[env:esp32dev_baseline]
extends = env:esp32dev
build_flags = -DDEMO_PROFILER=0
