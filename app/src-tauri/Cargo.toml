[package]
name = "malgrind"
version = "0.1.0"
edition = "2021"
description = "valgrind for microcontrollers"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true
